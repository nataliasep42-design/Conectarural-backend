# render.yaml — Configuración de despliegue en Render
# Documentación: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: conectarural-api
    env: node
    region: frankfurt          # elige el más cercano a tus usuarias
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render asigna PORT automáticamente; no hace falta declararlo.
      # JWT_SECRET, ALLOWED_ORIGIN y FCM_SERVICE_ACCOUNT_JSON se añaden
      # manualmente en el dashboard de Render (Environment → Add env var).
      - key: JWT_SECRET
        sync: false            # valor secreto: introducir manualmente en Render
      - key: ALLOWED_ORIGIN
        sync: false            # p.ej. https://conectarural-26759.web.app
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: conectarural-db
          property: connectionString

databases:
  - name: conectarural-db
    databaseName: conectarural_db
    user: conectarural_user
    region: frankfurt
    plan: free
